name: 🐛 Bug Report
description: Report a bug or issue
title: "[BUG] "
labels: ["type:bug", "ai:story-analysis"]
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Report
        This will be automatically analyzed by our AI to prioritize and route to the correct team.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of what the bug is
      placeholder: When I click the Save button, I get an error message...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
      placeholder: The data should be saved and a success message displayed
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
      placeholder: An error message appears and data is not saved
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (System down)
        - High (Major feature broken)
        - Medium (Feature partially broken)
        - Low (Minor issue)
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Where did this occur?
      placeholder: |
        - Environment: Production / NPE / Local
        - Browser: Chrome 120
        - OS: Windows 11
    validations:
      required: true

  - type: checkboxes
    id: affected-repos
    attributes:
      label: Affected Components
      options:
        - label: Backend API (userManagementApi)
        - label: Frontend UI (fincore_WebUI)
        - label: Infrastructure (fincore_Iasc)
